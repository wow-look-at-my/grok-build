[package]
license = "Apache-2.0"
name = "xai-grok-markdown"
version = "0.1.0"
edition.workspace = true
authors = ["xAI"]
description = "Streaming markdown renderer for terminal UIs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
anstyle = { workspace = true }
anstyle-lossy = { workspace = true }
anstyle-syntect = { workspace = true }
html-escape = { workspace = true }
linkify = { workspace = true }
pulldown-cmark = { workspace = true }
ratatui = { workspace = true }
supports-color = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
textwrap = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
xai-grok-markdown-core = { workspace = true }

[dependencies.crossterm]
workspace = true
features = ["event-stream", "bracketed-paste"]
optional = true

[dependencies.xai-ratatui-textarea]
workspace = true
optional = true

[dev-dependencies]
criterion = { workspace = true }
pretty_assertions = { workspace = true }

[[bin]]
name = "md-table-test"
path = "bin/md_table_test.rs"
required-features = ["playground"]

[[bin]]
name = "md-mermaid-test"
path = "bin/md_mermaid_test.rs"
required-features = ["playground"]

[features]
default = []
playground = ["dep:crossterm", "dep:xai-ratatui-textarea"]

[[bench]]
name = "bench"
harness = false

# Mirrors the denied set in [workspace.lints.clippy]. This package names a tool's lint table itself, so cargo
# forbids inheriting as well, and the set cannot be inherited.
[lints.clippy]
cast_lossless = "allow" # 5 hits predate the gate
cast_possible_truncation = "allow" # 2 hits predate the gate
cast_possible_wrap = "allow" # 4 hits predate the gate
cast_precision_loss = "allow" # 14 hits predate the gate
cast_sign_loss = "allow" # 5 hits predate the gate
expect_used = "allow" # 3 hits predate the gate
string_slice = "deny"
unwrap_used = "allow" # 1 hit predates the gate
