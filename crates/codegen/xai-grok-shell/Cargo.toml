[package]
license = "Apache-2.0"
name = "xai-grok-shell"
version = "1.0.41"
edition.workspace = true
autotests = false

[features]
default = []
dhat-heap = ["dep:dhat"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`. Forwards login, sampler, and workspace
# `test-support` so downstream test builds see those crates' test seams
# (`isolated_spawn_e2e` uses `WorkspaceOps::for_test`).
test-support = [
    "xai-grok-shell-core/test-support",
    "xai-grok-login/test-support",
    "xai-grok-sampler/test-support",
    "xai-grok-workspace/test-support",
]
test-util = []
# Local Computer Hub workspace_server (own/attach + crash-restart). Requires
local-workspace = ["xai-grok-shell-core/local-workspace"]
# CI default set (preferred over cargo `default` for hermetic CI builds):
# `config-docs` is on this set (not cargo `default`) so hermetic lib tests
# parse the committed config-reference page.
config-docs = []
default-bazel = [
    "local-workspace",
    "test-support",
    "config-docs",
]

[dependencies]
dunce = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
xai-grok-announcements = { workspace = true }
xai-prompt-queue = { workspace = true }
xai-grok-version = { workspace = true }

async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
kanal = "0.1"
regex = { workspace = true }
# The MCP code in this crate (extensions/mcp.rs) reaches rmcp
# model types via `xai_grok_mcp::rmcp::model::*`. Every HTTP and WebSocket
# call site in this crate goes through xai-grok-net.
xai-grok-mcp = { workspace = true }
xai-grok-net = { workspace = true }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
xai-acp-lib = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
webbrowser = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
gix = { workspace = true }
xai-gix-status = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
dhat = { workspace = true, optional = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
xai-fast-worktree = { path = "../xai-fast-worktree", features = ["metadata"] }

xai-grok-paths = { path = "../xai-grok-paths" }
xai-grok-shell-base = { workspace = true }
xai-grok-shell-core = { workspace = true }
xai-grok-shell-assets = { path = "../xai-grok-shell-assets" }
xai-grok-shell-session-support = { workspace = true }
xai-grok-shell-terminal = { workspace = true }
xai-grok-shared = { workspace = true }
xai-grok-status-line = { workspace = true }
xai-tracing-macros = { path = "../xai-tracing-macros" }
xai-fsnotify = { path = "../xai-fsnotify" }
xai-codebase-graph = { path = "../xai-codebase-graph" }
xai-hunk-tracker = { path = "../xai-hunk-tracker" }
xai-agent-lifecycle = { workspace = true }
xai-interjection-core = { workspace = true }
xai-message-delivery-core = { workspace = true }
xai-grok-sandbox = { path = "../xai-grok-sandbox", default-features = false }
xai-chat-state = { path = "../xai-chat-state" }
# Segment markdown rendering + the `compaction/` store path convention.
xai-compaction-transcript = { workspace = true }
xai-grok-compaction = { path = "../../common/xai-grok-compaction" }
xai-grok-extra-ca = { workspace = true }
# Leader lock: bounded flock polling behind the machine-local acquire slot.
xai-grok-file-lock = { workspace = true }
xai-grok-sampler = { path = "../xai-grok-sampler" }
# Session FTS search; owns this crate's only rusqlite/bundled-SQLite use.
xai-grok-session-search = { workspace = true }
xai-token-estimation = { workspace = true }
xai-grok-sampling-types = { path = "../xai-grok-sampling-types" }
xai-grok-tools = { path = "../xai-grok-tools" }
xai-tty-utils = { workspace = true }
xai-workflow = { path = "../xai-workflow" }
xai-grok-workspace = { workspace = true }
# Backs the compatibility-only `xai_grok_shell::foreign_sessions` re-export.
xai-grok-foreign-sessions = { workspace = true }
xai-grok-subagent-resolution = { path = "../xai-grok-subagent-resolution" }
xai-grok-agent = { path = "../xai-grok-agent" }
xai-grok-bundle = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-feedback = { workspace = true }
xai-grok-config-types = { workspace = true }
xai-grok-env = { workspace = true }
xai-dirs = { workspace = true }
xai-grok-memory = { workspace = true }
xai-grok-hooks = { path = "../xai-grok-hooks" }
xai-hooks-plugins-types = { path = "../xai-hooks-plugins-types" }
xai-grok-plugin-marketplace = { path = "../xai-grok-plugin-marketplace" }
xai-file-utils = { path = "../xai-file-utils" }
xai-grok-otel = { workspace = true }
xai-grok-session-events = { workspace = true }
xai-grok-auth = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-grok-http = { workspace = true }
xai-grok-login = { workspace = true }
xai-grok-models = { workspace = true }
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
flate2 = { workspace = true }
fs2 = { workspace = true }
tar = { workspace = true }
url = { workspace = true }
tdigests = "1.0"
semver = { workspace = true }
parking_lot.workspace = true

# Used by acp_session.rs for the unified
# xai_tool_runtime::Tool dispatch model and the computer-hub MCP adapter.
xai-computer-hub-sdk = { workspace = true }
xai-tool-runtime = { workspace = true }
xai-tool-protocol = { workspace = true }
xai-tool-types = { workspace = true }
xai-spawn = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true }

[target.'cfg(windows)'.dependencies]
siphasher = { workspace = true }
windows = { workspace = true }

[dev-dependencies]
xai-dirs = { workspace = true }
# Mock servers in tests: a WebSocket server and raw requests against a mock.
reqwest = { workspace = true }
tokio-tungstenite = { workspace = true }
xai-grok-net = { workspace = true, features = ["test-loopback-session"] }
xai-grok-status-line = { workspace = true, features = ["test-support"] }
criterion = { workspace = true }
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = { workspace = true }
filetime = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
# `extensions::bundle` tests build archives with `bundle::test_helpers`, which
# is `#[cfg(test)]`-only inside xai-grok-bundle without this feature.
xai-grok-bundle = { workspace = true, features = ["test-support"] }
xai-grok-memory = { workspace = true, features = ["test-support"] }
# sandbox-enforce: keep tests running against the enforcing sandbox build.
xai-grok-workspace = { workspace = true, features = ["test-support", "sandbox-enforce"] }
xai-grok-config = { workspace = true, features = [] }
tar = { workspace = true }
flate2 = { workspace = true }
semver = { workspace = true }
serial_test = { workspace = true }
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
xai-grok-shell-base = { workspace = true, features = ["test-support"] }
# The core crate's `#[cfg(test)]` seams and `test_support` helpers, for this crate's tests.
xai-grok-shell-core = { workspace = true, features = ["test-util"] }
# Exposes the login crate's `#[cfg(test)]`-only auth-provider helpers
# (`test_counting_provider`, `test_backdate_provider_mint`) to shell tests.
xai-grok-login = { workspace = true, features = ["test-support"] }
# Exposes sampler's `notify_on_submit` mock to lib tests via feature unification.
xai-grok-sampler = { path = "../xai-grok-sampler", features = ["test-support"] }
xai-grok-test-support = { workspace = true, features = [] }
xai-test-utils = { workspace = true }
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = { workspace = true, features = ["test-util"] }

[dependencies.tempfile]
workspace = true

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "fork_copy"
harness = false
required-features = ["test-support"]

[[bench]]
name = "skills_watcher_startup"
harness = false

[[bench]]
name = "child_replay_lookup"
harness = false

# Every integration test is a module of this one binary, so cargo links it once.
# Many tests set process-global state, so run them under nextest, which gives
# each test its own process.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["test-support"]

# The profile sandbox's CI hand-off is driven through the shipped startup path
# (`config::apply_sandbox`), which starts the unsandboxed `gh` worker before the
# confinement is installed. That needs the child to re-enter this binary and
# dispatch the worker on the marker env var the way the pager's `main` does. A
# libtest binary cannot. Its harness ignores the marker and would run the whole
# suite instead of serving the protocol.
[[test]]
name = "sandbox_ci_host_startup"
path = "tests/sandbox_ci_host_startup/main.rs"
harness = false

[lints]
workspace = true
[build-dependencies]
# build.rs only downloads ripgrep — no rmcp involvement. Workspace reqwest
# (0.12) is plenty.
reqwest = { workspace = true, features = ["blocking"] }
flate2 = { workspace = true }
tar = { workspace = true }

[[bin]]
name = "chat-history-downgrade"
path = "src/bin/chat-history-downgrade.rs"
