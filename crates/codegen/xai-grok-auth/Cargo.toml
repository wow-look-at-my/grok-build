[package]
license = "Apache-2.0"
name = "xai-grok-auth"
version = "0.1.0"
edition.workspace = true
description = "Auth dependency-inversion seam: HttpAuth + AuthCredentialProvider traits"
authors = ["xAI"]

[features]
# Kept so dependents that name it still build.
middleware = []

[dependencies]
async-trait = { workspace = true }
tracing = { workspace = true }
xai-grok-net = { workspace = true }

[dev-dependencies]
mockito = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
xai-grok-net = { workspace = true, features = ["test-loopback-session"] }

[lints]
workspace = true
