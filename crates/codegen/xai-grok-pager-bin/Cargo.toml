[package]
name = "xai-grok-pager-bin"
version = "1.0.41"
edition.workspace = true
license = "Apache-2.0"
authors = ["xAI"]
default-run = "xai-grok-pager"

# Composition-root binary for the Grok Build TUI. The artifact is still named
# `xai-grok-pager`.
[[bin]]
name = "xai-grok-pager"
path = "src/main.rs"

[dependencies]
# The pager library (all application logic + the public API main.rs drives).
xai-grok-pager = { path = "../xai-grok-pager" }

# Agent runtime + leader/stdio/headless entry points.
xai-grok-login = { workspace = true }
xai-grok-shell = { workspace = true }
xai-grok-version = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-grok-workspace = { workspace = true }
xai-crash-handler = { path = "../xai-crash-handler" }
xai-acp-lib = { workspace = true }

# Async runtime + misc.
tokio = { workspace = true, features = [
    "sync",
    "rt",
    "macros",
    "rt-multi-thread",
    "signal",
    "io-util",
    "io-std",
] }
tokio-util = { workspace = true, features = ["compat"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dunce = { workspace = true }
xai-tty-utils = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-sandbox = { path = "../xai-grok-sandbox", default-features = false }
xai-grok-extra-ca = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
serial_test = { workspace = true }
# `PagerArgs::try_parse_from` in the CLI-parsing unit tests (needs the
# `clap::Parser` trait in scope).
clap = { workspace = true, features = ["derive"] }

[features]
default = [
    "sandbox-enforce",
    ]
default-bazel = [
    "sandbox-enforce",
    "local-workspace",
    ]
# xai-grok-workspace no longer enables sandbox-enforce by default, so enable it here.
sandbox-enforce = ["xai-grok-pager/sandbox-enforce", "xai-grok-workspace/sandbox-enforce"]
local-workspace = ["xai-grok-pager/local-workspace"]
# Test-only, prod-inert seam: lets the e2e harness install a TEST-signed managed-policy key the
# spawned pager trusts. Double locked out of production: absent from `default`, `default-bazel`, and
# `release-dist`, and the install hook is additionally gated on `debug_assertions` (off in shipped
# `-c opt`/release builds). Never add this to a shipped feature set.
test-seams = []
release-dist = [
    "xai-grok-pager/release-dist",
    ]
