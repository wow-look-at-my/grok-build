[package]
license = "Apache-2.0"
name = "xai-grok-session-search"
version = "0.1.0"
edition.workspace = true
description = "SQLite FTS5 index over local grok sessions: lease-guarded bootstrap, debounced incremental upserts, and BM25 ranked query"

[dependencies]
async-trait = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
xai-grok-config = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-sqlite-journal = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
