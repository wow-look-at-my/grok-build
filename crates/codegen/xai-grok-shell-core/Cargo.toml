# Cargo.toml holds the Cargo code.

[package]
license = "Apache-2.0"
name = "xai-grok-shell-core"
version = "0.1.0"
edition.workspace = true
description = "The grok shell's config, persistence, storage, remote and leader layers. The session actor and the agent in xai-grok-shell build on it."

[features]
default = []
# Forwards login, sampler and workspace `test-support`, like the shell's feature of the same name.
test-support = [
    "xai-grok-login/test-support",
    "xai-grok-sampler/test-support",
    "xai-grok-workspace/test-support",
]
# Exposes the `#[cfg(test)]` seams of this crate to the shell's test targets.
test-util = []
local-workspace = []
default-bazel = ["local-workspace", "test-support"]

[dependencies]
dunce = { workspace = true }
agent-client-protocol = { workspace = true }
anyhow = { workspace = true }
xai-grok-announcements = { workspace = true }
xai-prompt-queue = { workspace = true }
xai-grok-version = { workspace = true }
async-openai = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
bm25 = "2.3"
bytes = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
ignore = { workspace = true }
jsonschema = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
globset = { workspace = true }
kanal = "0.1"
regex = { workspace = true }
xai-grok-mcp = { workspace = true }
xai-grok-net = { workspace = true }
serde = { workspace = true }
serde_ignored = "0.1"
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
clap = { workspace = true }
toml = { workspace = true, features = ["preserve_order"] }
toml_edit = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "process",
    "rt",
    "macros",
    "rt-multi-thread",
    "net",
    "sync",
] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = [
    "env-filter",
    "fmt",
    "json",
    "time",
] }
tokio-util = { workspace = true, features = ["compat", "rt"] }
tokio-retry = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "v7"] }
xai-acp-lib = { workspace = true }
axum = { workspace = true, features = ["ws", "multipart"] }
backon = { workspace = true }
webbrowser = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }
futures-util = { workspace = true }
urlencoding = { workspace = true }
gethostname = { workspace = true }
gix = { workspace = true }
xai-gix-status = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
nucleo = { workspace = true }
arc-swap = { workspace = true }
infer = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
moka = { workspace = true, features = ["future"] }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
xai-fast-worktree = { path = "../xai-fast-worktree", features = ["metadata"] }
xai-grok-paths = { path = "../xai-grok-paths" }
xai-grok-shell-base = { workspace = true }
xai-grok-shell-assets = { path = "../xai-grok-shell-assets" }
xai-grok-shell-session-support = { workspace = true }
xai-grok-shell-terminal = { workspace = true }
