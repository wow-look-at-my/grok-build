# cargo-nextest configuration.
# https://nexte.st/docs/configuration/
#
# Per-test timeout: a hung test (e.g. a PTY test waiting for a shell that
# doesn't exist on a lean runner) blocks the whole test binary and wastes
# the entire CI job timeout. nextest runs each test in its own process and
# enforces a per-test timeout via slow-timeout. A hung test fails fast
# instead of blocking the rest.
#
# Most tests finish in <1s; the slowest legitimate tests (PTY e2e,
# integration suites) finish in <30s.

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 1 }

# Don't retry on timeout — fail immediately so the hang is visible.
retries = 0

# Run ALL tests even on failure (equivalent to cargo test --no-fail-fast).
# A single failure should not hide every test after it — the next push
# would find a new one each time. fail-fast = false means nextest runs
# every test regardless of individual failures.
fail-fast = false

# The curated scroll-matrix cells are host-paced PTY sessions. They measure
# real scroll timing against a live pager, so running several at once stretches
# the gesture gaps they assert on. The suite serializes them with a static
# mutex, which works under `cargo test` (one process, many threads) and NOT
# under nextest, which gives every test its own process. This group restores
# that guarantee — without it the mutex is a no-op and the cells go flaky. It
# takes 33s on a 4-core box with nothing else running. The test is not hung. It
# gets its own deadline instead of a cap that measures the runner's load.
[[profile.ci.overrides]]
filter = 'test(compress_camera_sized_photo_succeeds)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The PTY tests launch the pager binary (PAGER_BINARY), so the CI archive carries it.
[profile.ci.archive]
include = [
    { path = "debug/xai-grok-pager", relative-to = "target" },
    # The startup benchmark seeds its --continue boot with this.
    { path = "debug/startup-resume-seed", relative-to = "target" },
]

[test-groups]
scroll-matrix = { max-threads = 1 }
disabled-hooks-file = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary_id(xai-grok-pager-pty-harness::it) and test(/^scroll_matrix_curated::/)'
test-group = 'scroll-matrix'

# These tests write the real user `$GROK_HOME/disabled-hooks`. `grok_home()`
# is cached per process, so a temp home cannot isolate them. Their
# `serial(disabled_hooks_file)` lock holds only inside a single process.
[[profile.default.overrides]]
filter = 'test(/managed_hooks_tests::/)'
test-group = 'disabled-hooks-file'
