# Clippy config for the whole workspace.
#
# clippy reads the NEAREST clippy.toml and merges nothing, so this file has to
# stand alone: one file at the repository root reaches every crate in the
# workspace, and a second one anywhere under `crates/` would silently take over
# for every crate beneath it.

# TODO: remove after https://github.com/hyperium/tonic/issues/2253 fixed.
large-error-threshold = 256

# Tests may index and slice freely; an out-of-range index there is just a failing test.
# Production crates opt in with #![deny(clippy::indexing_slicing)] at the crate root.
# Like the bans below, this applies to `cargo clippy` only; the Bazel lint aspect
# reads the repo-root config, so inline #[cfg(test)] modules must not index in CI.
allow-indexing-slicing-in-tests = true

# Ban raw canonicalize: on Windows it returns verbatim `\\?\C:\...` paths that
# break external tools, leak into prompts, and poison path-equality keys.
# `dunce::canonicalize` keeps the verbatim form for paths it cannot simplify
# (over multiple chars, device names), so containment checks there fail closed.
#
# Ban raw child-process spawning: an unenrolled child outlives the session that
# started it, while an enrolled one dies with its scope. Allow with a reason
# where a child is waited on or deliberately detached.
#
# Ban std::env::home_dir: hand-rolled grok-home resolution drifted across
# crates ($HOME-only reads broke Windows GUI-spawned processes, which have
# USERPROFILE but no HOME). xai-dirs carries the one sanctioned call.
# Deliberately scoped to crates/codegen: the tree that ships to Windows
# clients owns this policy, and repo-wide enforcement only produced
# false positives in server-side code.
#
# Ban dirs::home_dir for the same reason: on Windows it asks the known-folder
# API and ignores a redirected USERPROFILE, so it can disagree with
# xai_dirs::home_dir — and with Node-based tools, whose os.homedir()
# reads USERPROFILE. Every home-anchored path resolves
# via xai_dirs so all sites land in the same tree.
#
# The canonicalize and spawn bans below are enforced by `cargo clippy` and
# `just lint-rs` only: the Bazel lint aspect pins the repo-root config, which
# does not carry them.
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "bypasses the grok TLS policy (backend pin, OS roots, GROK_EXTRA_CA_BUNDLE); build through xai_grok_extra_ca; localhost-only clients allow with a reason" },
    { path = "reqwest::blocking::Client::new", reason = "bypasses the grok TLS policy (backend pin, OS roots, GROK_EXTRA_CA_BUNDLE); build through xai_grok_extra_ca; localhost-only clients allow with a reason" },
    { path = "reqwest::ClientBuilder::build", reason = "use xai_grok_extra_ca::build_reqwest_client: it applies the grok TLS policy and survives a broken OS store; localhost/test clients allow with a reason" },
    { path = "reqwest::blocking::ClientBuilder::build", reason = "use xai_grok_extra_ca::build_blocking_reqwest_client: it applies the grok TLS policy and survives a broken OS store; localhost/test clients allow with a reason" },
    { path = "std::fs::canonicalize", reason = "returns \\\\?\\ verbatim paths on Windows; use dunce::canonicalize" },
    { path = "std::path::Path::canonicalize", reason = "returns \\\\?\\ verbatim paths on Windows; use dunce::canonicalize" },
    { path = "tokio::fs::canonicalize", reason = "returns \\\\?\\ verbatim paths on Windows; use xai_grok_tools::util::fs helpers or spawn_blocking + dunce::canonicalize" },
    { path = "std::env::home_dir", reason = "grok-home resolution goes through xai-dirs (uncached) or xai_grok_config::grok_home (cached); generic home via xai_dirs::home_dir" },
    # allow-invalid: most codegen crates no longer depend on `dirs` at all,
    # which would otherwise warn that the banned path is unreachable.
    { path = "dirs::home_dir", reason = "home-anchored paths resolve via xai_dirs::home_dir so all sites agree; Node-based tools use os.homedir, which matches it, not the known-folder API", allow-invalid = true },
    { path = "std::process::Command::spawn", reason = "an unenrolled child outlives its session; use xai_tty_utils::ProcessScope::enroll" },
    { path = "tokio::process::Command::spawn", reason = "an unenrolled child outlives its session; use xai_tty_utils::ProcessScope::enroll", allow-invalid = true },
    { path = "portable_pty::SlavePty::spawn_command", reason = "an unenrolled pty child outlives its session; enroll the shell with xai_tty_utils::ProcessScope::enroll_terminal_pid", allow-invalid = true },
    # A child's bytes are not text. A strict decode answers one undecodable byte by
    # discarding the whole payload, so the model sees an empty result where the tool
    # actually printed something. Invalid bytes are information, not an error.
    { path = "std::string::String::from_utf8", reason = "a child's output, a file, or a socket is bytes; one undecodable byte throws the whole payload away -- use String::from_utf8_lossy, or allow with a reason where invalid bytes ARE the answer (binary detection, or a path that must reopen)" },
    # std locks poison on a panic while held, so the panic of one request turns every
    # later acquisition into a panic too. parking_lot's do not poison at all.
    { path = "std::sync::Mutex::lock", reason = "a panic while held poisons the lock, so the next lock() panics too and one bad tool call ends the session -- use parking_lot::Mutex, whose lock() cannot fail" },
    { path = "std::sync::RwLock::read", reason = "a panic while held poisons the lock, so every later read() panics -- use parking_lot::RwLock, whose read() cannot fail" },
    { path = "std::sync::RwLock::write", reason = "a panic while held poisons the lock, so every later write() panics -- use parking_lot::RwLock, whose write() cannot fail" },
    # A dropped JoinHandle is a dropped failure: the task panicked and the caller
    # keeps waiting on work that already died.
    { path = "tokio::spawn", reason = "a dropped JoinHandle loses the task's panic, leaving its callers waiting on work that already died -- await and check the result, or run the future through xai_grok_tools::util::detached::guarded so a panicked task still releases what others wait on" },
]
