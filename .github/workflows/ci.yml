name: CI

on:
  # Matches every branch and no tag, so the publish job cannot re-enter on its own tag.
  push:
    branches: ['**']
  # Build one tree twice: rerunning a finished run is denied to every session credential.
  workflow_dispatch:

permissions:
  contents: read

# A master run is never cancelled: a rapid merge must not strand a commit with no CI, or kill a publish mid-upload.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # xai-grok-sandbox's `fails_closed_on_non_utf8_*` hit errno 84 under a non-UTF-8 locale.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # sccache caches per compilation unit and cannot cache incremental, so this must stay 0 for it to hit at all.
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: "sccache"
  # Cargo runs `$RUSTC_WRAPPER $RUSTC <args>`, so sccache receives this gate as its compiler and
  # execs it only when it is going to compile. A cache hit is answered from the cache and never
  # reaches it. That is what lets CARGO_BUILD_JOBS below run wide over the lookups while the
  # compiles that actually cost memory stay rationed. ci/rustc-gate.sh has the rest.
  RUSTC: ${{ github.workspace }}/ci/rustc-gate.sh
  # The RAM cap, moved off cargo and onto the compiles alone. Two monolith crates peak near 7.8 and
  # 7.4 GiB against the runner's 15 GiB, which is what fixes this at three.
  GATE_SLOTS: "3"
  # Disk only. The GHA layer writes one Actions cache entry per compilation unit, and this workspace is ~1800 of them per job; against the documented 200-entry-per-minute ceiling that is minutes of throttling, and once the jobs got fast enough to finish together it failed a job outright with `CreateCacheEntry: (429) Too Many Requests`. actions/cache carries the same objects in ONE entry per job, so the second layer only ever added traffic.
  SCCACHE_DIR: ${{ github.workspace }}/.sccache
  # Budget arithmetic, not a guess: the repo gets 10 GB of Actions cache and the disk-layer keys are now the only thing in it. Bounding each key keeps one generation near 7 GB, so Actions LRU only ever has a superseded generation to drop, and sccache's LRU trims oldest-first inside a key.
  SCCACHE_CACHE_SIZE: "2G"
  # Without this the server idles out during the test step, and the post-job --show-stats reports a fresh server's 0 requests instead of the build's.
  SCCACHE_IDLE_TIMEOUT: "0"
  # Debuginfo on every test binary needs >37 GB of target/ against a runner's ~14 GB, and ld then dies on a bus error.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  BUILDHOST_SERVER: https://pazer.build
  BUILDHOST_PROJECT: grok-build

jobs:
  build-test:
    name: Build & test
    # Hosted deliberately: this suite asserts host semantics the org's lean self-hosted image lacks. See AGENTS.md.
    runs-on: ubuntu-latest
    # A ceiling, not a target: a job needing more than this has a hung test, which nextest fails in 60s.
    timeout-minutes: 45
    env:
      # This key holds the whole workspace's test objects, measured at 2.0 GB, so it gets the larger share of the 10 GB budget. The two single-binary keys keep the 2G default.
      SCCACHE_CACHE_SIZE: "3G"
      # The harness builds this itself when unset, once per nextest process, all queued on cargo's package lock.
      PAGER_BINARY: ${{ github.workspace }}/target/debug/xai-grok-pager
      # No global CARGO_BUILD_JOBS: the compile-RAM cap belongs to the build step alone. See ci/ram-guard.sh.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # After the checkout: it reads the workspace, and an empty one enforces nothing.
      - uses: wow-look-at-my/actions@yaml-comment-block#latest

      # The runner starts with ~86 GB free and CARGO_PROFILE_*_DEBUG=0 holds target/ near 4 GB, so the 2m11s delete step this replaces was freeing 26 GB nobody needed.
      - name: Report disk before build
        run: df -h /

      - name: Install protoc (pinned v29.3)
        run: |
          # bin/protoc is the source of truth for this artifact and its sha256. Update both together.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      # rg_path() ends at a bare "rg" on PATH, so without this the grep and glob tests fail on empty output.
      - name: Install ripgrep
        uses: wow-look-at-my/actions@cache-rg#latest

      # bubblewrap: jail_bwrap_e2e drives the `--sandbox` command builder against real bwrap, and reports a skip without it. mold: .cargo/config.toml links x86_64-unknown-linux-gnu with it.
      - name: Install bubblewrap and mold
        run: sudo apt-get install -y bubblewrap mold

      # Each test runs in its own process under a per-test timeout (.config/nextest.toml), which cargo test has none of.
      - name: Install cargo-nextest
        run: |
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      # sccache keys on the real compilation inputs, where rust-cache restores a target/ tarball cargo recompiles anyway.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        # The leading 'v' is load-bearing: the download URL is built from this and only the tag v0.17.0 exists.
        with:
          version: v0.17.0

      # Keyed on the lockfile, so it is written once per dependency change and read on every run after: the objects it holds only go stale when a dependency moves.
      - name: Restore the sccache objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-dev-linux-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: sccache-dev-linux-

      # One unified --workspace --no-run: an --exclude/-p split re-unifies features and recompiles cold at -j16.
      # -j is high on purpose now. It paces cache LOOKUPS, which cost no memory, and this workspace is about 1800 of them; the RAM cap moved to GATE_SLOTS, which sccache applies to the compiles it actually runs.
      - name: Build test harnesses (compile, no-run)
        env:
          CARGO_BUILD_JOBS: "16"
        run: |
          cargo test --locked --workspace --no-run --no-fail-fast
          # Built once here, rather than once per nextest process on cargo's package lock.
          cargo build --locked -p xai-grok-pager-bin

      # Read here, not post-job: this is the compile these numbers describe, and a low hit rate is why a run is slow.
      - name: sccache stats (compile)
        run: sccache --show-stats

      # The ci profile sets fail-fast = false, so one failure does not hide the rest, and --version smoke-tests the binary.
      - name: Run tests (workspace)
        run: |
          cargo nextest run --locked --workspace --profile ci
          "$PAGER_BINARY" --version

      # Fails if the sub-crate split is undone or the -j3 unified compile is removed. ci/ram-guard.sh has the measurements.
      - name: RAM guard (sub-crate split + unified --no-run at -j3 intact)
        run: |
          set -euo pipefail
          # bundle/builtin must stay out of the shell crate.
          [ -f crates/codegen/xai-grok-shell-assets/src/bundle.rs ] \
          && [ -f crates/codegen/xai-grok-shell-assets/src/builtin.rs ] \
          || { echo "RAM GUARD: FAIL — bundle/builtin must live in xai-grok-shell-assets"; exit 1; }
          [ ! -f crates/codegen/xai-grok-shell/src/bundle.rs ] \
          && [ ! -f crates/codegen/xai-grok-shell/src/builtin.rs ] \
          || { echo "RAM GUARD: FAIL — bundle/builtin re-inlined into xai-grok-shell"; exit 1; }
          grep -q 'xai-grok-shell-assets' crates/codegen/xai-grok-shell/Cargo.toml \
          || { echo "RAM GUARD: FAIL — shell must depend on xai-grok-shell-assets"; exit 1; }
          # Bracketed classes keep the awk script's own source text out of the scan it runs over this file.
          awk '
            /--no-run --no-fail-fast/ { compile=1 }
            /--exclude xai[-]grok-shell/ || /-p xai[-]grok-shell -p xai[-]grok-pager/ { splitbad=1 }
            END { exit (compile && !splitbad) ? 0 : 1 }
          ' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — build must be a single unified --no-run, no exclude/-p split"; exit 1; }
          # The cap moved off cargo and onto the compiles sccache actually runs, so the guard follows it.
          # All three must hold together: the gate is only reached because RUSTC points at it, and it only
          # rations misses because sccache is the wrapper that execs it.
          [ -x ci/rustc-gate.sh ] \
            || { echo "RAM GUARD: FAIL — ci/rustc-gate.sh must exist and be executable"; exit 1; }
          grep -q 'RUSTC: ${{ github.workspace }}/ci/rustc-gate.sh' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — RUSTC must point at ci/rustc-gate.sh, or nothing rations compiles"; exit 1; }
          grep -q 'RUSTC_WRAPPER: "sccache"' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — sccache must be the wrapper: it is what execs the gate on a miss"; exit 1; }
          grep -q 'GATE_SLOTS: "3"' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — GATE_SLOTS must stay 3"; exit 1; }
          grep -qF -- 'cargo nextest run --locked --workspace --profile ci' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — run step missing"; exit 1; }
          echo "RAM GUARD: PASS — sub-crate split + unified --no-run compile at -j3 intact, run step fast-passes"

  # These assert on what a virtual terminal actually shows, which a unit test over the width function cannot stand in for.
  pty-e2e:
    name: Test (PTY end-to-end)
    # Hosted for the same reason as build-test: these need a real /bin/bash.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same key as build-test, so the same ceiling: a smaller one here would trim objects build-test still wants.
      SCCACHE_CACHE_SIZE: "3G"
      PAGER_BINARY: ${{ github.workspace }}/target/debug/xai-grok-pager
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Report disk before build
        run: df -h /

      - name: Install protoc (pinned v29.3)
        run: |
          # bin/protoc is the source of truth for this artifact and its sha256. Update both together.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Install cargo-nextest
        run: |
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      # .cargo/config.toml links x86_64-unknown-linux-gnu with mold.
      - name: Install mold
        run: sudo apt-get install -y mold

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      # Same key as build-test: both compile the same dev-profile objects, so they share one entry rather than each paying for their own.
      - name: Restore the sccache objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-dev-linux-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: sccache-dev-linux-

      # Built once here, rather than once per nextest process on cargo's package lock.
      - name: Build the PTY harnesses and the pager binary
        run: |
          cargo test --locked -p xai-grok-pager --no-run \
            --test pty_e2e_smoke \
            --test pty_e2e_config_ui \
            --test pty_e2e_minimal
          cargo build --locked -p xai-grok-pager-bin

      - name: sccache stats (compile)
        run: sccache --show-stats

      # Every case spawns a process, so cap the workers rather than fanning out to the core count.
      - name: Test (PTY end-to-end)
        run: |
          cargo nextest run --locked -p xai-grok-pager --profile ci \
            --test pty_e2e_smoke \
            --test pty_e2e_config_ui \
            --test pty_e2e_minimal \
            --run-ignored all --test-threads 4

  build-release:
    name: Build release binary (linux/amd64)
    # ubuntu-22.04 ships glibc 2.35, which holds every GLIBC_x.y dependency at or below what a 22.04 user has.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install protoc (pinned v29.3)
        run: |
          # bin/protoc is the source of truth for this artifact and its sha256. Update both together.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      # .cargo/config.toml links x86_64-unknown-linux-gnu with mold.
      - name: Install mold
        run: sudo apt-get install -y mold

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        # Same 'v' prefix requirement as build-test: the tag is v0.17.0.
        with:
          version: v0.17.0

      # Release objects are built with different flags than the dev jobs', so they get their own key rather than sharing and missing.
      - name: Restore the sccache objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-release-linux-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: sccache-release-linux-

      - name: Build release binary
        run: cargo build --locked --release -p xai-grok-pager-bin

      # Guards the floor the build above buys: a symbol newer than 2.35 is a load error on Ubuntu 22.04.
      - name: Verify glibc symbols are <= 2.35 (linux/amd64)
        shell: bash
        run: |
          max_glibc="$(readelf --version-info target/release/xai-grok-pager 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -n1)"
          echo "max GLIBC symbol referenced: ${max_glibc:-none}"
          if [[ -z "$max_glibc" ]]; then exit 1; fi
          # Version string comparison, no external tools: 2.35 is the ceiling.
          if ! printf '%s\n2.35\n' "$max_glibc" | sort -V | head -n1 | grep -qx "$max_glibc"; then
            echo "FAIL: binary requires GLIBC $max_glibc, which is newer than 2.35 (not runnable on Ubuntu 22.04)"
            exit 1
          fi
          echo "PASS: max GLIBC $max_glibc <= 2.35, runs on Ubuntu 22.04"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/xai-grok-pager dist/grok-linux-amd64

      - uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: grok-linux-amd64
          path: dist/grok-linux-amd64

  # Every crate of the darwin binary compiles here. Only the link needs a Mac, and it is its own job below.
  build-darwin-objects:
    name: Compile darwin/arm64 (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      SDKROOT: ${{ github.workspace }}/.darwin-sdk
      GROK_DARWIN_LINK_BUNDLE: ${{ github.workspace }}/.darwin-link
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install protoc (pinned v29.3)
        run: |
          # protoc runs on the HOST, so this cross build takes the linux one. bin/protoc pins the same artifact and sha256.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Add the darwin target
        run: rustup target add aarch64-apple-darwin

      # zig compiles the C in the build scripts for macOS. It never links here: xai-darwin-link records that step instead.
      - name: Install zig (pinned 0.14.1)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          echo "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      # aws-lc-sys and its siblings include Apple headers (CoreServices, CoreFoundation), which zig does not carry.
      - name: Install the macOS SDK (pinned 14.5)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.xz" \
            https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz
          echo "6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d  $RUNNER_TEMP/sdk.tar.xz" | sha256sum -c -
          mkdir -p "$SDKROOT"
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$SDKROOT" --strip-components=1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        # Same 'v' prefix requirement as build-test: the tag is v0.17.0.
        with:
          version: v0.17.0

      # This job cross-compiles, but its build scripts and proc macros are host artifacts and take the linux-gnu rustflags, so mold is needed here too.
      - name: Install mold
        run: sudo apt-get install -y mold

      # The darwin target's objects are its own: a shared key would miss on every lookup and evict the linux entries for nothing.
      - name: Restore the sccache objects
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-darwin-arm64-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: sccache-darwin-arm64-

      # cc-rs reads these per-target. ci/zig-cc replaces the target cc-rs chooses, which zig rejects; ar and ranlib take no target.
      - name: Point the C toolchain at zig
        run: |
          printf '#!/bin/sh\nexec zig ar "$@"\n' > "$RUNNER_TEMP/zig-ar"
          printf '#!/bin/sh\nexec zig ranlib "$@"\n' > "$RUNNER_TEMP/zig-ranlib"
          chmod +x "$RUNNER_TEMP/zig-ar" "$RUNNER_TEMP/zig-ranlib"
          {
            echo "CC_aarch64_apple_darwin=$PWD/ci/zig-cc"
            echo "CXX_aarch64_apple_darwin=$PWD/ci/zig-cxx"
            echo "AR_aarch64_apple_darwin=$RUNNER_TEMP/zig-ar"
            echo "RANLIB_aarch64_apple_darwin=$RUNNER_TEMP/zig-ranlib"
          } >> "$GITHUB_ENV"

      - name: Build the link recorder
        run: |
          cargo build --locked --release -p xai-darwin-link
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$PWD/target/release/xai-darwin-link" >> "$GITHUB_ENV"

      # The link at the end of this records itself into GROK_DARWIN_LINK_BUNDLE rather than running.
      - name: Compile every crate for darwin/arm64
        run: cargo build --locked --release --target aarch64-apple-darwin -p xai-grok-pager-bin

      - name: Bundle the recorded link
        run: ci/darwin-bundle.sh "$GROK_DARWIN_LINK_BUNDLE" dist/darwin-link.tar

      - uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: darwin-link-bundle
          path: dist/darwin-link.tar

  # The only macOS job in this workflow: one cc invocation over a bundle Linux built.
  link-darwin:
    name: Link darwin/arm64 (macOS)
    needs: build-darwin-objects
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: darwin-link-bundle
          path: dist

      - name: Link the darwin binary
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-link"
          tar -xf dist/darwin-link.tar -C "$RUNNER_TEMP/darwin-link"
          ci/darwin-relink.sh "$RUNNER_TEMP/darwin-link" "$PWD/dist/grok-darwin-arm64"

      - uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: grok-darwin-arm64
          path: dist/grok-darwin-arm64

  publish-create:
    name: Create buildhost release
    needs: [build-test, build-release, link-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> buildhost; only these jobs talk to buildhost
    outputs:
      version: ${{ steps.rel.outputs.version }}
    steps:
      - name: Create release
        id: rel
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-create-release@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}

  publish-upload:
    name: Upload ${{ matrix.target_os }}/${{ matrix.target_arch }} binary
    needs: publish-create
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
          - target_os: darwin
            target_arch: arm64
    steps:
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: grok-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist

      - name: Upload binary
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-upload-artifact@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}
          version: ${{ needs.publish-create.outputs.version }}
          os: ${{ matrix.target_os }}
          arch: ${{ matrix.target_arch }}
          path: dist/grok-${{ matrix.target_os }}-${{ matrix.target_arch }}
          kind: binary

  publish-finalize:
    name: Publish buildhost release
    needs: [publish-create, publish-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      artifact-metadata: write # buildhost-publish-release records what it stored on the org's linked artifacts page
      actions: write # cache-cleanup deletes this run's binary hand-offs
    steps:
      - name: Publish release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-release@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}
          version: ${{ needs.publish-create.outputs.version }}

      # always(), so a failed publish still clears the run-scoped copies buildhost has now superseded.
      - name: Clean up binary hand-offs
        if: always()
        uses: wow-look-at-my/actions@cache-cleanup#latest
