name: CI

on:
  # Matches every branch and no tag, so the publish job cannot re-enter on its own tag.
  push:
    branches: ['**']
  # Build one tree twice: rerunning a finished run is denied to every session credential.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a push cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # xai-grok-sandbox's `fails_closed_on_non_utf8_*` hit errno 84 under a non-UTF-8 locale.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Cargo reuses its own per-package artifacts in target/, which a compilation cache in front of it cannot do: a hit there still runs a process and writes the object out.
  CARGO_INCREMENTAL: "0"
  # Debuginfo on every test binary needs >37 GB of target/ against a runner's ~14 GB, and ld then dies on a bus error.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  BUILDHOST_SERVER: https://pazer.build
  BUILDHOST_PROJECT: grok-build

jobs:
  build-test:
    name: Build & test
    # Hosted deliberately: this suite asserts host semantics the org's lean self-hosted image lacks. See AGENTS.md.
    runs-on: ubuntu-22.04
    # A ceiling, not a target. The compile is cold every run (measured 31 min at -j3) and a hung test is failed by nextest in 60s, so a job past this is broken, not slow.
    timeout-minutes: 75
    env:
      # The harness builds this itself when unset, once per nextest process, all queued on cargo's package lock.
      PAGER_BINARY: ${{ github.workspace }}/target/debug/xai-grok-pager
      # No global CARGO_BUILD_JOBS: the -j3 compile-RAM cap belongs to the build step alone.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Report disk before build
        run: df -h /

      # - uses: wow-look-at-my/actions@yaml-comment-block#latest  (off until slopfix runs on ubuntu-22.04: its APE trips the runner's Mono binfmt handler on the MZ magic)

      - uses: ./.github/actions/setup-protoc

      - uses: ./.github/actions/setup-cargo-timings

      # rg_path() ends at a bare "rg" on PATH, so without this the grep and glob tests fail on empty output.
      - name: Install ripgrep
        uses: wow-look-at-my/actions@cache-rg#latest

      # bubblewrap: jail_bwrap_e2e drives the `--sandbox` command builder against real bwrap, and reports a skip without it. mold: .cargo/config.toml links x86_64-unknown-linux-gnu with it. Restored files need no apt index, so the version the image's index pins and the mirror has dropped stops mattering.
      - name: Install bubblewrap and mold
        uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: bubblewrap mold

      # Each test runs in its own process under a per-test timeout (.config/nextest.toml), which cargo test has none of.
      - name: Install cargo-nextest
        run: |
          mkdir -p "$RUNNER_TEMP/nextest-bin"
          curl -fsSL -o "$RUNNER_TEMP/nextest.tar.gz" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.143/cargo-nextest-0.9.143-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/nextest-bin"
          echo "$RUNNER_TEMP/nextest-bin" >> "$GITHUB_PATH"

      # The registry dependencies, which a lockfile determines and a push does not. Measured on run 35459915405: they are 1909 of build-test's 4161 compile CPU-seconds. The script builds the workspace to reach them, then prunes the workspace artifacts back out, so what the entry carries is the dependency tree alone. The hashFiles comment is what keys the entry: cached-run digests the script text, and the runner expands the expression before the action sees it. No restore-keys, so an entry holds one lockfile's dependencies and never accumulates.
      - name: Build the dependencies
        uses: wow-look-at-my/actions@cached-run#latest
        with:
          key: rustdeps-dev
          paths: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/debug/deps
            target/debug/build
            target/debug/.fingerprint
          run: |
            # ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
            export CARGO_BUILD_JOBS=3
            cargo test --locked --workspace --no-run --no-fail-fast
            ci/cache-deps.sh prune target/debug

      # -j3 is the widest -j the runner's 15 GiB holds.
      - name: Build test harnesses (compile, no-run)
        env:
          CARGO_BUILD_JOBS: "3"
        run: |
          start=$(date +%s)
          cargo test --locked --workspace --no-run --no-fail-fast
          # Built once here, rather than once per nextest process on cargo's package lock.
          cargo build --locked -p xai-grok-pager-bin
          echo "compile wall: $(( $(date +%s) - start )) s"
          echo "target: $(du -sh target 2>/dev/null | cut -f1)"

      - name: Run tests (workspace)
        run: |
          cargo nextest run --locked --workspace --profile ci
          "$PAGER_BINARY" --version

      # The PTY cases are #[ignore]d, so the run above built their binaries and skipped every case; this is the only thing that executes them. Same `--workspace` scope as the compile step on purpose: `-p xai-grok-pager` resolves its own feature set and rebuilds the graph instead of reusing target/. `!cancelled()` keeps a workspace-test failure from hiding a PTY failure.
      - name: Test (PTY end-to-end)
        if: ${{ !cancelled() }}
        run: |
          cargo nextest run --locked --workspace --profile ci \
            -E 'binary(pty_e2e_smoke) or binary(pty_e2e_config_ui) or binary(pty_e2e_minimal)' \
            --run-ignored all --test-threads 4

      - uses: ./.github/actions/upload-cargo-timings
        with:
          name: cargo-timings-build-test

  # Every release target, enabled or not. A disabled row stays declared and is filtered out of the matrix, so turning one on is a single field. The filter is a job because `strategy` reads no context a workflow-level list could sit in, and a job-level `if` cannot see `matrix`.
  release-targets:
    name: Plan the release targets
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rows: ${{ steps.rows.outputs.rows }}
    steps:
      - id: rows
        run: |
          cat > rows.json <<'JSON'
          [
            {"name": "linux/amd64",   "runs-on": "ubuntu-22.04",   "target": "x86_64-unknown-linux-gnu",  "darwin": false, "enabled": true},
            {"name": "darwin/arm64",  "runs-on": "ubuntu-22.04",   "target": "aarch64-apple-darwin",      "darwin": true,  "enabled": true},
            {"name": "windows/amd64", "runs-on": "windows-latest", "target": "x86_64-pc-windows-msvc",    "darwin": false, "enabled": false},
            {"name": "windows/arm64", "runs-on": "windows-latest", "target": "aarch64-pc-windows-msvc",   "darwin": false, "enabled": false}
          ]
          JSON
          jq -e 'length > 0' rows.json > /dev/null
          echo "rows=$(jq -c '[.[] | select(.enabled)]' rows.json)" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.name): \(if .enabled then "enabled" else "DISABLED" end)"' rows.json

  build-release:
    name: Build release (${{ matrix.name }})
    needs: release-targets
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      # One target's failure leaves the others' results worth reading.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release-targets.outputs.rows) }}
    env:
      SDKROOT: ${{ github.workspace }}/.darwin-sdk
      GROK_DARWIN_LINK_BUNDLE: ${{ github.workspace }}/.darwin-link
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: ./.github/actions/setup-protoc

      - uses: ./.github/actions/setup-cargo-timings

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      # zig compiles the C in the build scripts for macOS. It never links: xai-darwin-link records that step instead.
      - name: Install zig (pinned 0.14.1)
        if: matrix.darwin
        run: |
          curl -fsSL -o "$RUNNER_TEMP/zig.tar.xz" https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz
          echo "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      # aws-lc-sys and its siblings include Apple headers (CoreServices, CoreFoundation), which zig does not carry.
      - name: Install the macOS SDK (pinned 14.5)
        if: matrix.darwin
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sdk.tar.xz" \
            https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz
          echo "6e146275d19f027faa2e8354da5e0267513abf013b8f16ad65a231653a2b1c5d  $RUNNER_TEMP/sdk.tar.xz" | sha256sum -c -
          mkdir -p "$SDKROOT"
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C "$SDKROOT" --strip-components=1

      # .cargo/config.toml links x86_64-unknown-linux-gnu with mold. Restored files need no apt index, so the version the image's index pins and the mirror has dropped stops mattering.
      - name: Install mold
        uses: wow-look-at-my/actions@cached-apt#latest
        with:
          packages: mold

      # cc-rs reads these per-target. ci/zig-cc replaces the target cc-rs chooses, which zig rejects; ar and ranlib take no target.
      - name: Point the C toolchain at zig
        if: matrix.darwin
        run: |
          printf '#!/bin/sh\nexec zig ar "$@"\n' > "$RUNNER_TEMP/zig-ar"
          printf '#!/bin/sh\nexec zig ranlib "$@"\n' > "$RUNNER_TEMP/zig-ranlib"
          chmod +x "$RUNNER_TEMP/zig-ar" "$RUNNER_TEMP/zig-ranlib"
          {
            echo "CC_aarch64_apple_darwin=$PWD/ci/zig-cc"
            echo "CXX_aarch64_apple_darwin=$PWD/ci/zig-cxx"
            echo "AR_aarch64_apple_darwin=$RUNNER_TEMP/zig-ar"
            echo "RANLIB_aarch64_apple_darwin=$RUNNER_TEMP/zig-ranlib"
          } >> "$GITHUB_ENV"

      # The recorder is a host binary, so it takes no --target.
      - name: Build the link recorder
        if: matrix.darwin
        run: |
          cargo build --locked --release -p xai-darwin-link
          echo "CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=$PWD/target/release/xai-darwin-link" >> "$GITHUB_ENV"

      # On the darwin row the link at the end of this records itself into GROK_DARWIN_LINK_BUNDLE rather than running.
      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }} -p xai-grok-pager-bin

      # Proves the slot is reachable and that a stamp reaches `--version`, on a COPY so the uploaded artifact stays unstamped for the real number. Only a row whose output this runner can execute.
      - name: Probe the version stamp on a copy
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo build --locked --release -p xai-grok-stamp
          cp target/${{ matrix.target }}/release/xai-grok-pager "$RUNNER_TEMP/probe"
          target/release/xai-grok-stamp "$RUNNER_TEMP/probe" 0.0.0-slot-probe
          got="$("$RUNNER_TEMP/probe" --version)"
          echo "stamped copy reports: $got"
          case "$got" in
            "grok 0.0.0-slot-probe"*) echo "PASS: the stamp reaches --version" ;;
            *) echo "FAIL: stamped 0.0.0-slot-probe, --version says $got" ; exit 1 ;;
          esac

      # Guards the floor the build above buys: a symbol newer than 2.35 is a load error on Ubuntu 22.04.
      - name: Verify glibc symbols are <= 2.35 (linux/amd64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          max_glibc="$(readelf --version-info target/${{ matrix.target }}/release/xai-grok-pager 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -n1)"
          echo "max GLIBC symbol referenced: ${max_glibc:-none}"
          if [[ -z "$max_glibc" ]]; then exit 1; fi
          # Version string comparison, no external tools: 2.35 is the ceiling.
          if ! printf '%s\n2.35\n' "$max_glibc" | sort -V | head -n1 | grep -qx "$max_glibc"; then
            echo "FAIL: binary requires GLIBC $max_glibc, which is newer than 2.35 (not runnable on Ubuntu 22.04)"
            exit 1
          fi
          echo "PASS: max GLIBC $max_glibc <= 2.35, runs on Ubuntu 22.04"

      - uses: ./.github/actions/upload-cargo-timings
        with:
          name: cargo-timings-build-release-${{ matrix.target }}

      # The darwin row hands over the recorded link instead of a binary, because the link has not run yet.
      - name: Bundle the recorded link
        if: matrix.darwin
        run: ci/darwin-bundle.sh "$GROK_DARWIN_LINK_BUNDLE" dist/darwin-link.tar

      - uses: wow-look-at-my/actions@cache-upload#latest
        if: matrix.darwin
        with:
          name: darwin-link-bundle
          path: dist/darwin-link.tar

      - name: Stage artifact
        if: '!matrix.darwin'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/xai-grok-pager dist/grok-linux-amd64

      - uses: wow-look-at-my/actions@cache-upload#latest
        if: '!matrix.darwin'
        with:
          name: grok-linux-amd64
          path: dist/grok-linux-amd64

  # The link is the one step that needs a Mac. It waits on the tests as well as its bundle: it takes seconds, so starting it early buys nothing and spends a macOS runner on a tree that may not pass.
  link-darwin:
    name: Link darwin/arm64 (macOS)
    needs: [build-release, build-test]
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: darwin-link-bundle
          path: dist

      - name: Link the darwin binary
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-link"
          tar -xf dist/darwin-link.tar -C "$RUNNER_TEMP/darwin-link"
          ci/darwin-relink.sh "$RUNNER_TEMP/darwin-link" "$PWD/dist/grok-darwin-arm64"

      - uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: grok-darwin-arm64
          path: dist/grok-darwin-arm64

  # The jail and the CI host worker have a macOS half (Seatbelt, sandbox-exec) that a Linux runner cannot execute. This crate is small enough to compile natively here.
  test-darwin-sandbox:
    name: Test sandbox crate (macOS)
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Test xai-grok-sandbox on macOS
        run: cargo test --locked -p xai-grok-sandbox

  publish:
    # Every test AND every build first: a number is only assigned to a tree that already built and passed.
    needs: [build-test, test-darwin-sandbox, build-release, link-darwin]
    name: Publish buildhost release
    # macOS because patching an arm64 Mach-O invalidates the ad-hoc signature `ld` left, and `codesign` is the only thing that puts one back. The linux binary is stamped here too: patching an ELF needs no Linux.
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> buildhost
      artifact-metadata: write # buildhost-publish-release records what it stored on the org's linked artifacts page
      actions: write # cache-cleanup deletes this run's binary hand-offs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: grok-linux-amd64
          path: dist

      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: grok-darwin-arm64
          path: dist

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Build the stamper
        run: cargo build --locked --release -p xai-grok-stamp

      # buildhost assigns the number here. Nothing before this point needed it, which is why every build and test already ran.
      - name: Create release
        id: rel
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-create-release@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}

      # The stamper reads each slot back off disk after writing it, so a binary that did not take the number fails here.
      - name: Write the release number into both binaries
        run: |
          set -euo pipefail
          for binary in dist/grok-linux-amd64 dist/grok-darwin-arm64; do
            chmod +x "$binary"
            target/release/xai-grok-stamp "$binary" '${{ steps.rel.outputs.version }}'
          done

      - name: Re-sign the darwin binary
        run: codesign --force --sign - dist/grok-darwin-arm64

      # This runner is the arm64 Mac, so this is the darwin binary itself answering. The linux binary's own `--version` runs in build-release.
      - name: Verify the darwin binary reports the release number
        run: |
          set -euo pipefail
          got="$(dist/grok-darwin-arm64 --version)"
          want="grok ${{ steps.rel.outputs.version }}"
          echo "buildhost release: $want"
          echo "binary reports:    $got"
          case "$got" in
            "$want"*) echo "PASS: the stamp matches the buildhost release" ;;
            *) echo "FAIL: the binary does not report the buildhost release" ; exit 1 ;;
          esac

      # The CLI takes a plain bearer, and buildhost accepts a GitHub OIDC token as one. Its audience is the server URL.
      - name: Mint a buildhost bearer from GitHub OIDC
        uses: wow-look-at-my/actions@typescript#latest
        with:
          script: |
            const server = "${{ env.BUILDHOST_SERVER }}";
            const token = await core.getIDToken(server);
            core.setSecret(token);
            core.exportVariable("BUILDHOST_TOKEN", token);

      - name: Install the buildhost CLI
        run: |
          set -euo pipefail
          curl -fLo "$RUNNER_TEMP/buildhost" \
            "https://dl.pazer.build/buildhost?os=darwin&arch=arm64"
          chmod +x "$RUNNER_TEMP/buildhost"
          "$RUNNER_TEMP/buildhost" version

      # Both uploads at once. The CLI chunks a body past the edge's cap by itself, and `--draft` keeps each call from publishing the release out from under the other.
      - name: Upload both binaries in parallel
        run: |
          set -euo pipefail
          upload() {
            "$RUNNER_TEMP/buildhost" publish \
              --server '${{ env.BUILDHOST_SERVER }}' \
              --token "$BUILDHOST_TOKEN" \
              --project '${{ env.BUILDHOST_PROJECT }}' \
              --version '${{ steps.rel.outputs.version }}' \
              --os "$1" --arch "$2" --kind binary \
              --artifact "dist/grok-$1-$2" \
              --draft
          }
          upload linux amd64 &
          linux=$!
          upload darwin arm64 &
          darwin=$!
          # Both are waited on before either exit code is read, so one failure never leaves the other upload orphaned.
          linux_status=0
          darwin_status=0
          wait "$linux" || linux_status=$?
          wait "$darwin" || darwin_status=$?
          echo "linux/amd64 exit $linux_status, darwin/arm64 exit $darwin_status"
          if [ "$linux_status" -ne 0 ] || [ "$darwin_status" -ne 0 ]; then
            echo "FAIL: an upload did not complete"
            exit 1
          fi

      - name: Publish release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-release@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}
          version: ${{ steps.rel.outputs.version }}

      # always(), so a failed publish still clears the run-scoped copies buildhost has now superseded.
      - name: Clean up binary hand-offs
        if: always()
        uses: wow-look-at-my/actions@cache-cleanup#latest
