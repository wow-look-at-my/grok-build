name: CI

on:
  push:

permissions:
  contents: read

# Cancel superseded runs on branches, but let every master run finish so
# rapid merges can't leave master commits with no completed CI, and so a
# publish already in flight is never cancelled mid-upload.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  # sccache wraps rustc and caches individual compilation outputs (per
  # crate/compilation unit) in the GitHub Actions cache, so a changed crate
  # only invalidates its own cached artifacts — not a whole target/ tarball.
  # This requires CARGO_INCREMENTAL=0 (sccache cannot cache incremental
  # compilation). rust-cache alone restored target/ but cargo recompiled
  # everything anyway (fingerprints don't survive the zip round-trip), so the
  # "cache hit" was a 14-min full recompile every time. sccache actually hits.
  CARGO_INCREMENTAL: "0"
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # Linking every crate's test binaries WITH debuginfo needs >37 GB of target/
  # (measured); a runner has ~14 GB free, and ld dies on a bus error partway
  # through the shell crate's integration tests. Nothing here reads a symbol.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  BUILDHOST_SERVER: https://pazer.build
  BUILDHOST_PROJECT: grok-build

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Namespace this job's sccache entries away from the darwin release
      # job so the more-frequent linux runs can't evict the darwin cache
      # entries from the shared 10 GB GHAC bucket. sccache reads
      # SCCACHE_GHA_VERSION before falling back to SCCACHE_GHA_ENABLED and
      # uses it as the cache namespace (SHA-256'd into the GHAC `name`).
      # The `0.17.0` token here MUST stay in sync with the pinned
      # `version:` input on the sccache-action step below — the GHA cache key
      # is `sccache-v{VERSION}-{SCCACHE_GHA_VERSION}`, so a mismatch between
      # the installed sccache version and this namespace invalidates the cache.
      SCCACHE_GHA_VERSION: sccache-v0.17.0-x86_64-unknown-linux-gnu
      # No global CARGO_BUILD_JOBS here. The compile-RAM protection lives
      # entirely on the "Build test harnesses" step, which pins CARGO_BUILD_JOBS
      # to 3 (see its comment). The run step reuses that same unified graph and
      # fast-passes at full parallelism; the release jobs build lib+bins (no
      # monolith test harnesses) at default parallelism.
      # WHY bounded at 3, not a global cap: two crates — xai-grok-shell (365k
      # LOC, 4,595 in-lib #[test]s) and xai-grok-pager (463k LOC, 8,468 in-lib
      # #[test]s) — each compile their whole crate + every in-lib test into ONE
      # rustc that cold-peaks at ~9 GiB and ~7.3 GiB (measured). That peak is
      # monomorphization-bound and NOT reducible by codegen-units (128->512
      # unchanged), incremental, or any [profile] knob. Even when the two units
      # overlap at -j3 on a cold build, their honest aggregate is measured at
      # ~13.4 GiB — comfortably under the 16 GiB runner cap — so -j3 keeps the
      # workspace meaningfully parallel while staying safely within budget.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # This repo's `cargo test --workspace` needs >37 GB of target/ (the
      # pager links ~90 test binaries) and a stock runner only has ~14 GB
      # free, so the long Build & test job has repeatedly ground to a hang on
      # full disk (ld/rustc I/O stalls). Free the known-safe oversized image
      # dirs BEFORE building. dotnet/android/swift/haskell are never needed
      # here; tool caches (rustup, sccache) are kept for speed.
      # Run early so there is headroom for the entire build+test.
      - name: Free up disk space before build
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true
          swap-storage: true
          docker-images: true
          android: true
          dotnet: true
          haskell: true

      - name: Install protoc (pinned v29.3)
        run: |
          # Same release artifact + sha256 the repo's dotslash launcher
          # (bin/protoc) pins for linux-x86_64. bin/protoc is the source of
          # truth; update both together when bumping protoc.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
          echo "3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a  $RUNNER_TEMP/protoc.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      # The grep and glob tools shell out to ripgrep: rg_path() ends at a bare
      # "rg" on PATH, and a runner has none, so every one of their tests failed
      # on empty output rather than on anything they assert.
      - name: Install ripgrep
        uses: wow-look-at-my/actions@cache-rg#latest

      # sccache caches individual rustc compilation outputs in the GHA cache.
      # Unlike rust-cache (which restores a dumb target/ tarball that cargo
      # recompiles from scratch anyway), sccache keys on the actual compilation
      # inputs and only recompiles what genuinely changed.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        # The version input MUST carry the leading 'v': the action builds its
        # download URL as releases/download/${version}/... which only exists
        # for the tag 'v0.17.0'. Dropping the v made it 404 and skip the whole
        # build. This installed binary still reports 0.17.0, so it stays in
        # sync with SCCACHE_GHA_VERSION above and the GHA cache key
        # (sccache-v{VERSION}-{SCCACHE_GHA_VERSION}) is unchanged.
        with:
          version: v0.17.0

      # Build-then-run split: the expensive, RAM-heavy phase is *compiling* the
      # ~90 test harnesses. Two workspace crates — xai-grok-shell (365k LOC,
      # 4,595 in-lib #[test]s) and xai-grok-pager (463k LOC, 8,468 in-lib
      # #[test]s) — each compile their entire crate + every in-lib test into ONE
      # rustc that cold-peaks at ~9 GiB and ~7.3 GiB respectively (measured).
      # That peak is monomorphization-bound and NOT reducible by codegen-units,
      # incremental, or any [profile] knob (proven); the tests are
      # `#[cfg(test)] mod tests { use super::* }` private-access child modules,
      # so moving them to a separate crate would require making massive private
      # surfaces pub (a test-dropping refactor). The OOM happens when those
      # multi-GiB harnesses compile CONCURRENTLY in the one `cargo test` call.
      #
      # We therefore (a) compile once with `--no-run` in the SAME unified
      # `--workspace` resolution as the run step (so the run step fast-passes
      # and never recompiles a different graph — a second exclude/isolation
      # invocation was rejected because it changed workspace feature-unification
      # and forced a broad cold recompile at -j16), and (b) bound this compile's
      # parallelism so the two irreducible ~9+7 GiB units do not overlap on a
      # cold build (CI is sccache-warmed, but a cold graph must still stay
      # under the 16 GiB runner cap). The run step below then runs the already
      # built binaries at full parallelism.
      - name: Build test harnesses (compile, no-run)
        env:
          CARGO_BUILD_JOBS: "3"
        run: |
          cargo test --locked --workspace --no-run --no-fail-fast

      # --no-fail-fast: without it cargo stops at the first failing crate, so a
      # single failure hides every crate after it and the next push finds a new
      # one. One run, the whole list. Binaries are already built above, so this
      # just executes them (cargo fast-passes the compile).
      # The smoke test runs first (the pager binary is a workspace member;
      # --version confirms it links and runs before we spend time on the rest).
      - name: Run tests (workspace)
        run: |
          cargo test --locked --workspace --no-fail-fast
          ./target/debug/xai-grok-pager --version

      # RAM regression guard: prevent the compile-RAM pathology from silently
      # coming back (see the build step above). Two monolith crates' single-rustc
      # test harnesses cold-peak at ~9 GiB and ~7.3 GiB (irreducible, proven).
      # The compile phase must run under one unified `--workspace` --no-run at a
      # bounded -j3 (so the run step never recompiles a divergent graph at -j16
      # and the two monoliths don't overlap on a cold build). This cheap,
      # deterministic STRUCTURAL guard fails if that protection is removed. The
      # real cold aggregate-RSS measurement of the shipped command is committed
      # as ci/ram-guard.sh.
      - name: RAM guard (unified --no-run at -j3 intact)
        run: |
          set -euo pipefail
          # Check the BUILD step is a single unified --workspace --no-run at -j3,
          # and that no split (an --exclude / -p invocation that changes
          # workspace feature-unification and forced a broad -j16 recompile) has
          # been reintroduced. Use bracketed classes in the patterns so the awk
          # script's own source text is not matched by the same file scan.
          awk '
            /--no-run --no-fail-fast/ { compile=1 }
            /--exclude xai[-]grok-shell/ || /-p xai[-]grok-shell -p xai[-]grok-pager/ { splitbad=1 }
            END { exit (compile && !splitbad) ? 0 : 1 }
          ' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — build must be a single unified --no-run, no exclude/-p split"; exit 1; }
          grep -q 'CARGO_BUILD_JOBS: "3"' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — missing -j3 on compile step"; exit 1; }
          grep -qF -- 'cargo test --locked --workspace --no-fail-fast' .github/workflows/ci.yml \
            || { echo "RAM GUARD: FAIL — run step missing"; exit 1; }
          echo "RAM GUARD: PASS — unified --no-run compile at -j3 intact, run step fast-passes"

      # The PTY suites drive the real binary through a virtual terminal and
      # assert on what is actually on screen. They are #[ignore]d because they
      # need a built binary, which is why nothing ran them -- and unit tests
      # cannot stand in for them: a model picker whose rows rendered blank had
      # passing tests over the width function the whole time. Every case here
      # spawns a process, so cap the workers rather than letting libtest fan out
      # to the core count.
      - name: Test (PTY end-to-end)
        env:
          PAGER_BINARY: ${{ github.workspace }}/target/debug/xai-grok-pager
        run: |
          cargo test --locked -p xai-grok-pager --no-fail-fast \
            --test pty_e2e_smoke \
            --test pty_e2e_config_ui \
            --test pty_e2e_minimal \
            -- --ignored --test-threads 4

  build-release:
    name: Build release binary (${{ matrix.target_os }}/${{ matrix.target_arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Per-target sccache namespace: linux and darwin get distinct GHAC
      # buckets so neither can evict the other's entries from the shared
      # 10 GB repo cache. See build-test's SCCACHE_GHA_VERSION comment.
      # The `0.17.0` token in each matrix value must stay in sync with the
      # pinned `version:` input on the sccache-action step below.
      SCCACHE_GHA_VERSION: ${{ matrix.sccache_version }}
    strategy:
      matrix:
        include:
          # ubuntu-22.04 ships glibc 2.35, the same libc users on Ubuntu 22.04
          # (and most other distros) have. Building here keeps every GLIBC_x.y
          # dependency at or below 2.35, so the amd64 binary runs on 22.04
          # instead of demanding GLIBC_2.38/2.39 (which the previous
          # ubuntu-latest, glibc 2.39, runner linked against).
          - runner: ubuntu-22.04
            target_os: linux
            target_arch: amd64
            sccache_version: sccache-v0.17.0-x86_64-unknown-linux-gnu
            protoc_url: https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip
            protoc_sha256: 3e866620c5be27664f3d2fa2d656b5f3e09b5152b42f1bedbf427b333e90021a
            checksum_cmd: sha256sum -c -
          - runner: macos-14
            target_os: darwin
            target_arch: arm64
            sccache_version: sccache-v0.17.0-aarch64-apple-darwin
            protoc_url: https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-osx-aarch_64.zip
            protoc_sha256: 2b8a3403cd097f95f3ba656e14b76c732b6b26d7f183330b11e36ef2bc028765
            checksum_cmd: shasum -a 256 -c -
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install protoc (pinned v29.3)
        run: |
          # Same release artifact + sha256 the repo's dotslash launcher
          # (bin/protoc) pins for this platform. bin/protoc is the source of
          # truth; update both together when bumping protoc.
          curl -fsSL -o "$RUNNER_TEMP/protoc.zip" "${{ matrix.protoc_url }}"
          echo "${{ matrix.protoc_sha256 }}  $RUNNER_TEMP/protoc.zip" | ${{ matrix.checksum_cmd }}
          unzip -q -o "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "PROTOC=$RUNNER_TEMP/protoc/bin/protoc" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/protoc/bin/protoc" --version

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        run: rustup show

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11
        # Same 'v' prefix requirement as build-test: the tag is v0.17.0.
        with:
          version: v0.17.0

      - name: Build release binary
        run: cargo build --locked --release -p xai-grok-pager-bin

      # The linux binary is built on ubuntu-22.04 (glibc 2.35) so it runs on
      # Ubuntu 22.04. Guard the floor: fail if the produced binary demands any
      # symbol newer than 2.35 (which would reproduce the GLIBC_2.38/2.39 load
      # error on 22.04). Darwin binaries don't use GLIBC, so skip them.
      - name: Verify glibc symbols are <= 2.35 (linux/amd64)
        if: matrix.target_os == 'linux'
        shell: bash
        run: |
          max_glibc="$(readelf --version-info target/release/xai-grok-pager 2>/dev/null \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sed 's/GLIBC_//' | sort -V | tail -n1)"
          echo "max GLIBC symbol referenced: ${max_glibc:-none}"
          if [[ -z "$max_glibc" ]]; then exit 1; fi
          # Version string comparison, no external tools: 2.35 is the ceiling.
          if ! printf '%s\n2.35\n' "$max_glibc" | sort -V | head -n1 | grep -qx "$max_glibc"; then
            echo "FAIL: binary requires GLIBC $max_glibc, which is newer than 2.35 (not runnable on Ubuntu 22.04)"
            exit 1
          fi
          echo "PASS: max GLIBC $max_glibc <= 2.35, runs on Ubuntu 22.04"

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp target/release/xai-grok-pager "dist/grok-${{ matrix.target_os }}-${{ matrix.target_arch }}"

      - uses: wow-look-at-my/actions@cache-upload#latest
        with:
          name: grok-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/grok-${{ matrix.target_os }}-${{ matrix.target_arch }}

  publish-create:
    name: Create buildhost release
    needs: [build-test, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC -> buildhost; only these jobs talk to buildhost
    outputs:
      version: ${{ steps.rel.outputs.version }}
    steps:
      - name: Create release
        id: rel
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-create-release@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}

  publish-upload:
    name: Upload ${{ matrix.target_os }}/${{ matrix.target_arch }} binary
    needs: publish-create
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - target_os: linux
            target_arch: amd64
          - target_os: darwin
            target_arch: arm64
    steps:
      - uses: wow-look-at-my/actions@cache-download#latest
        with:
          name: grok-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist

      - name: Upload binary
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-upload-artifact@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}
          version: ${{ needs.publish-create.outputs.version }}
          os: ${{ matrix.target_os }}
          arch: ${{ matrix.target_arch }}
          path: dist/grok-${{ matrix.target_os }}-${{ matrix.target_arch }}
          kind: binary

  publish-finalize:
    name: Publish buildhost release
    needs: [publish-create, publish-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      artifact-metadata: write # buildhost-publish-release records what it stored on the org's linked artifacts page
      actions: write # cache-cleanup deletes this run's binary hand-offs
    steps:
      - name: Publish release
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-publish-release@master
        with:
          server: ${{ env.BUILDHOST_SERVER }}
          project: ${{ env.BUILDHOST_PROJECT }}
          version: ${{ needs.publish-create.outputs.version }}

      # The binaries are on buildhost now; the run-scoped cache copies are dead
      # weight. always() so a failed publish still cleans up after itself.
      - name: Clean up binary hand-offs
        if: always()
        uses: wow-look-at-my/actions@cache-cleanup#latest
