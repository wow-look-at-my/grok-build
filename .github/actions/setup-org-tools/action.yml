name: Set up org tools
description: Install org tools from buildhost, each from the build of the same-named branch when the tool has one, else from its default branch.
inputs:
  tools:
    description: Space-separated buildhost project names.
    required: true
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.tools }}
      shell: bash
      env:
        BRANCH: ${{ github.head_ref || github.ref_name }}
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail
        os=$(uname -s | tr '[:upper:]' '[:lower:]')
        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64 | arm64) arch=arm64 ;;
          *) echo "::error::no org tool build for $(uname -m)"; exit 1 ;;
        esac
        branch=$(jq -rn --arg b "$BRANCH" '$b|@uri')
        for tool in $TOOLS; do
          url="https://dl.pazer.build/${tool}?branch=${branch}&os=${os}&arch=${arch}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$url")
          case "$code" in
            302) echo "::notice::${tool} follows its branch ${BRANCH}" ;;
            404)
              echo "::notice::${tool} has no branch ${BRANCH}; installing its default branch"
              url="https://dl.pazer.build/${tool}?os=${os}&arch=${arch}"
              ;;
            *) echo "::error::dl.pazer.build answered ${code} for ${url}"; exit 1 ;;
          esac
          # Each build is an APE. A Linux runner's binfmt reads its MZ header as a Windows program, and execve on macOS refuses it. An APE is also a shell script, so sh starts it on both.
          sudo mkdir -p "/usr/local/lib/${tool}"
          sudo curl -fsSL -o "/usr/local/lib/${tool}/${tool}" "$url"
          printf '#!/bin/sh\nexec sh /usr/local/lib/%s/%s "$@"\n' "$tool" "$tool" | sudo tee "/usr/local/bin/${tool}" > /dev/null
          sudo chmod +x "/usr/local/bin/${tool}"
          # Each build boots through a separate loader, apeld-<os>-<arch>. Its header takes APE_LOADER, then /usr/local/lib/ape, /usr/lib/ape and PATH. It unpacks the copy it carries only into a writable directory, and a jailed process gets none. The header names that copy and the dd line that unpacks it, so unpack it here and install it where the header searches.
          sudo mkdir -p /usr/local/lib/ape
          loader="/usr/local/lib/ape/apeld-${os}-${arch}"
          if [ ! -x "$loader" ]; then
            stage=$(mktemp -d)
            recipe=""
            skip=""
            count=""
            if grep -a -A16 "l=apeld-${os}-${arch}" "/usr/local/lib/${tool}/${tool}" > "${stage}/branch" \
              && recipe=$(grep -a -m1 'dd if=' "${stage}/branch"); then
              skip=$(printf '%s' "$recipe" | sed -n 's/.*skip=\([0-9][0-9]*\).*/\1/p')
              count=$(printf '%s' "$recipe" | sed -n 's/.*count=\([0-9][0-9]*\).*/\1/p')
              if [ -n "$skip" ] && [ -n "$count" ]; then
                dd if="/usr/local/lib/${tool}/${tool}" bs=512 skip="$skip" count="$count" 2>/dev/null > "${stage}/raw"
                case "$recipe" in
                  *gzip*)
                    # A failed decompression leaves no loader, so nothing gets installed.
                    if ! gzip -dc < "${stage}/raw" > "${stage}/apeld" 2>/dev/null; then
                      rm -f "${stage}/apeld"
                    fi
                    ;;
                  *) cp "${stage}/raw" "${stage}/apeld" ;;
                esac
              fi
            fi
            # Only a loader that boots this tool is worth installing.
            if [ -s "${stage}/apeld" ]; then
              chmod 755 "${stage}/apeld"
              if APE_LOADER="${stage}/apeld" sh "/usr/local/lib/${tool}/${tool}" --version > /dev/null 2>&1; then
                sudo install -m 755 "${stage}/apeld" "$loader"
              fi
            fi
            rm -rf "$stage"
          fi
          "$tool" --version
        done
