name: Upload Cargo timing reports
description: Preserve Cargo's HTML build timing reports as a workflow artifact
inputs:
  name:
    description: Artifact name
    required: true
runs:
  using: composite
  steps:
    - name: Upload Cargo timing reports
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.name }}
        path: target/cargo-timings/
        if-no-files-found: warn
